<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - omegaUp</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f8f9fa;
        color: #343a40;
        text-align: center;
        padding: 20px;
      }
      h1 {
        color: #004b80;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        max-width: 500px;
      }
      .btn {
        display: inline-block;
        padding: 10px 20px;
        font-size: 1rem;
        color: #fff;
        background-color: #004b80;
        border: none;
        border-radius: 4px;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #00365d;
      }
    </style>
  </head>
  <body>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. Don't worry, omegaUp
      will automatically try to reconnect when you're back online.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Try to Reconnect
    </button>
  </body>
</html>
